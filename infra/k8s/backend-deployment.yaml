apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-backend
  namespace: finsight
  labels:
    app: finsight-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finsight-backend
  template:
    metadata:
      labels:
        app: finsight-backend
    spec:
      containers:
        - name: backend
          image: finsight/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: finsight-config
            - secretRef:
                name: finsight-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-backend
  namespace: finsight
spec:
  selector:
    app: finsight-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: finsight-postgres
  namespace: finsight
spec:
  serviceName: finsight-postgres
  replicas: 1
  selector:
    matchLabels:
      app: finsight-postgres
  template:
    metadata:
      labels:
        app: finsight-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: finsight
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-postgres
  namespace: finsight
spec:
  selector:
    app: finsight-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

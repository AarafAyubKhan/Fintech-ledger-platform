apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-redis
  namespace: finsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finsight-redis
  template:
    metadata:
      labels:
        app: finsight-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-redis
  namespace: finsight
spec:
  selector:
    app: finsight-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-frontend
  namespace: finsight
  labels:
    app: finsight-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsight-frontend
  template:
    metadata:
      labels:
        app: finsight-frontend
    spec:
      containers:
        - name: frontend
          image: finsight/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: finsight-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-frontend
  namespace: finsight
spec:
  selector:
    app: finsight-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
